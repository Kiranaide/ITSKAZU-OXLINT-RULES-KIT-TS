name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check-vendor
      - run: bun run build

  e2e:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pm: [npm, pnpm, yarn, bun]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:e2e
        env:
          E2E_PM: ${{ matrix.pm }}